[project]
name = "30-days-ai-agent-job"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.135.1",
    "httpx[socks]>=0.28.1",       # for wsl2 clash proxy settings, can be ignored
    "langdetect>=1.0.9",
    "llama-index>=0.14.18",
    "lxml>=6.0.2",
    "markdownify>=1.2.2",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]

[dependency-groups]
dev = ["ruff>=0.15.6"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
